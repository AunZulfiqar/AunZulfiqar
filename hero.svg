<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Muhammad Aun Bin Zulfiqar — Full-Stack Engineer and Security Engineering">
  <title>Muhammad Aun Bin Zulfiqar — Full-Stack Engineer · Security Engineering</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#04070F"/>
      <stop offset="45%"  stop-color="#0A1526"/>
      <stop offset="100%" stop-color="#04070F"/>
    </linearGradient>

    <radialGradient id="glow" cx="24%" cy="42%" r="58%">
      <stop offset="0%"   stop-color="#1D4ED8" stop-opacity="0.42"/>
      <stop offset="55%"  stop-color="#1D4ED8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="86%" cy="80%" r="46%">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#EAF2FF"/>
      <stop offset="52%"  stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="scanFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#60A5FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-opacity="0.30"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- drifting scan line -->
    <rect x="-3" y="0" width="3" height="320" fill="url(#scanFade)">
      <animate attributeName="x" values="-40;1240" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- signal waveform, lower right -->
    <g opacity="0.5" stroke="#1E5FA8" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M700 258 L740 258 L752 232 L764 282 L776 246 L788 258 L840 258 L852 240 L864 270 L876 258 L1104 258">
        <animate attributeName="stroke" values="#1E5FA8;#22D3EE;#1E5FA8" dur="4.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- availability pill, top right -->
    <g transform="translate(958,30)">
      <rect width="184" height="26" rx="13" fill="#08192B" stroke="#1E5FA8" stroke-opacity="0.8"/>
      <circle cx="17" cy="13" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.4;4.6;3.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11.5" letter-spacing="1.1" fill="#7DD3FC">AVAILABLE FOR WORK</text>
    </g>

    <!-- status readout, right -->
    <line x1="884" y1="104" x2="884" y2="212" stroke="#1E3A5F" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <g>
        <text x="908" y="126" fill="#3F5D80" letter-spacing="1.4">BUILD</text>
        <text x="1142" y="126" text-anchor="end" fill="#BFDBFE">Web apps that hold up</text>
      </g>
      <g>
        <text x="908" y="160" fill="#3F5D80" letter-spacing="1.4">BREAK</text>
        <text x="1142" y="160" text-anchor="end" fill="#BFDBFE">Threat detection &amp; UEBA</text>
      </g>
      <g>
        <text x="908" y="194" fill="#3F5D80" letter-spacing="1.4">BASE</text>
        <text x="1142" y="194" text-anchor="end" fill="#7DD3FC">Lahore &#183; Pakistan</text>
      </g>
    </g>
    <g stroke="#1E3A5F" stroke-width="1" opacity="0.7">
      <line x1="908" y1="139" x2="1142" y2="139"/>
      <line x1="908" y1="173" x2="1142" y2="173"/>
    </g>

    <!-- corner brackets -->
    <g stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.75">
      <path d="M28 62 L28 34 L56 34"/>
      <path d="M1172 258 L1172 286 L1144 286"/>
    </g>

    <!-- prompt line -->
    <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" letter-spacing="1.5" fill="#22D3EE" opacity="0.9">~/ </text>
    <text x="88" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" letter-spacing="1.5" fill="#5B7A9E">whoami</text>
    <rect x="163" y="79" width="8" height="16" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- name -->
    <text x="62" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="60" font-weight="800" letter-spacing="-1.5"
          fill="#1D4ED8" opacity="0.55" filter="url(#soft)">AUN BIN ZULFIQAR</text>
    <text x="62" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="60" font-weight="800" letter-spacing="-1.5" fill="url(#nameFill)">AUN BIN ZULFIQAR</text>

    <rect x="64" y="186" width="520" height="2" fill="url(#rule)"/>

    <!-- role -->
    <text x="64" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="19" font-weight="600" letter-spacing="0.4" fill="#BFDBFE">
      Full-Stack Engineer <tspan fill="#3B82F6">·</tspan> Security Engineering
    </text>

    <!-- stack chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.6">
      <g transform="translate(64,244)">
        <rect width="106" height="28" rx="6" fill="#0D1B2F" stroke="#1E3A5F"/>
        <text x="53" y="18.5" text-anchor="middle" fill="#93C5FD">TypeScript</text>
      </g>
      <g transform="translate(180,244)">
        <rect width="88" height="28" rx="6" fill="#0D1B2F" stroke="#1E3A5F"/>
        <text x="44" y="18.5" text-anchor="middle" fill="#93C5FD">Next.js</text>
      </g>
      <g transform="translate(278,244)">
        <rect width="84" height="28" rx="6" fill="#0D1B2F" stroke="#1E3A5F"/>
        <text x="42" y="18.5" text-anchor="middle" fill="#93C5FD">Python</text>
      </g>
      <g transform="translate(372,244)">
        <rect width="146" height="28" rx="6" fill="#0D1B2F" stroke="#1E3A5F"/>
        <text x="73" y="18.5" text-anchor="middle" fill="#67E8F9">Threat Detection</text>
      </g>
      <g transform="translate(528,244)">
        <rect width="86" height="28" rx="6" fill="#0D1B2F" stroke="#1E3A5F"/>
        <text x="43" y="18.5" text-anchor="middle" fill="#67E8F9">ML / AI</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#1E3A5F" stroke-opacity="0.85"/>
  </g>
</svg>
